# =============================================================================
#  SITE SETTINGS
# =============================================================================

remote_theme: "mmistakes/minimal-mistakes@4.28.0"

# Skins: air | aqua | contrast | dark | dirt | mint | neon | plum | sunrise | default
# "air" is clean and light. Try "neon" or "dark" if you want the moodier look.
minimal_mistakes_skin: "air"

locale: "en-US"
title: "Angel Raphael Rodriguez"
title_separator: "-"
subtitle: "Embedded systems - sensor security - brain-computer interfaces"
name: "Angel Raphael Rodriguez"
description: "Portfolio and project log of Angel Raphael Rodriguez. Embedded systems engineering, cyber-physical system security, and brain-computer interfaces."

url: "https://angelrrod00.github.io" 
baseurl: ""
repository: "angelrrod00/angelrrod00.github.io" 

# Uncomment once you drop a logo into assets/images/
# logo: "/assets/images/logo.png"

# Site-wide search (client side, no service needed)
search: true
search_full_content: true

# =============================================================================
#  AUTHOR SIDEBAR
#  This is the left column with your photo, bio, and links.
#  Delete any link block you don't want. Icons are Font Awesome 5 names.
# =============================================================================
author:
  name: "Angel Raphael Rodriguez"
  avatar: "/assets/images/profile.jpg" # add this file, or comment this line out
  bio: "Embedded systems engineering, cyber-physical system security, and brain-computer interfaces."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:angelrrod00@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/angelrrod00"
    - label: "SoundCloud"
      icon: "fab fa-fw fa-soundcloud"
      url: "https://soundcloud.com/angel-rodriguez-113046812"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/angelrrodriguez/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/angelrrod00"
    - label: "SoundCloud"
      icon: "fab fa-fw fa-soundcloud"
      url: "https://soundcloud.com/angel-rodriguez-113046812"

# =============================================================================
#  BUILD
# =============================================================================
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

markdown: kramdown
highlighter: rouge
timezone: America/New_York

# Posts live under their category, e.g. /science/trick-or-heat/
# This is what turns your four categories into real "folders" in the URL.
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache # required by the theme, do not remove

# Liquid-based archives. jekyll-archives is NOT allowed on GitHub Pages,
# so the theme falls back to these. Do not switch the type to "jekyll-archives".
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# =============================================================================
#  DEFAULTS - so you don't repeat front matter on every file
# =============================================================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
      toc: true
      toc_label: "On this page"
      toc_sticky: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
